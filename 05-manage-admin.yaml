apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manage-admin
  namespace: ""
rules:
  - apiGroups:
      - apps.mas.ibm.com/v1
    resources:
      - manageapps
      - manageworkspaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
